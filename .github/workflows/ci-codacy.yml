name: CI Codacy

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  codacy-analysis:
    name: Codacy Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@562ee3e92b8e92df8b67e0a5ff8aa8e261919c08 # v4.4.7
        with:
          output: results.sarif
          format: sarif
          # Report all issues without failing the build
          gh-code-scanning-compat: true
          max-allowed-issues: 2147483647

      - name: Normalize SARIF categories for Code Scanning upload
        run: |
          jq '
            .runs |= to_entries
            | .runs |= map(
                .value.automationDetails = (
                  (.value.automationDetails // {})
                  + {
                    id: (
                      ((.value.automationDetails.id // .value.tool.driver.name // "codacy") | tostring)
                      + "-"
                      + ((.key + 1) | tostring)
                    )
                  }
                )
                | .value
              )
          ' results.sarif > results-normalized.sarif

      - name: Upload SARIF results to GitHub code scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: results-normalized.sarif

name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  VSCPD_BUILD_NUMBER: ${{ github.run_number }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            configure: >-
              cmake -S . -B build
              -DCMAKE_BUILD_TYPE=Release
              -DVSCPD_BUILD_NUMBER=${VSCPD_BUILD_NUMBER}
              -DVSCPD_PACKAGE_GENERATORS=TGZ\;DEB\;RPM\;ZIP
          - name: macOS
            os: macos-latest
            configure: >-
              cmake -S . -B build
              -DCMAKE_BUILD_TYPE=Release
              -DCMAKE_PREFIX_PATH=${BREW_PREFIXES}
              -DVSCPD_BUILD_NUMBER=${VSCPD_BUILD_NUMBER}
              -DVSCPD_PACKAGE_GENERATORS=TGZ\;ZIP
          - name: Windows
            os: windows-latest
            configure: >-
              cmake -S . -B build
              -G "Visual Studio 18 2026"
              -A x64
              -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake
              -DVCPKG_TARGET_TRIPLET=x64-windows
              -DVSCPD_BUILD_MANPAGES=OFF
              -DVSCPD_BUILD_NUMBER=${VSCPD_BUILD_NUMBER}
              -DVSCPD_PACKAGE_GENERATORS=ZIP\;NSIS

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set mainline version
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        shell: bash
        run: |
          year=$(date -u +%y)
          month=$(date -u +%m)
          patch=$(git rev-list --count --first-parent HEAD)
          sed -i -E "s/(MQTTVSCPD_VERSION_MAJOR[[:space:]]+)[0-9]+/\\1${year}/" src/version.h
          sed -i -E "s/(MQTTVSCPD_VERSION_MINOR[[:space:]]+)[0-9]+/\\1${month}/" src/version.h
          sed -i -E "s/(MQTTVSCPD_VERSION_PATCH[[:space:]]+)[0-9]+/\\1${patch}/" src/version.h
          sed -i -E "s/(MQTTVSCPD_VERSION_STRING[[:space:]]+).*/\\1\"${year}.${month}.${patch}\"/" src/version.h
          sed -i -E "s/(MQTTVSCPD_DISPLAY_VERSION[[:space:]]+).*/\\1\"${year}.${month}.${patch}\"/" src/version.h

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            curl \
            libcurl4-openssl-dev \
            libexpat1-dev \
            libmosquitto-dev \
            libssl-dev \
            libsystemd-dev \
            mosquitto \
            pandoc \
            pkg-config \
            rpm

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install cjson expat mosquitto openssl pandoc
          echo "BREW_PREFIXES=$(brew --prefix openssl);$(brew --prefix expat);$(brew --prefix mosquitto);$(brew --prefix curl);$(brew --prefix cjson)" >> "$GITHUB_ENV"

      - name: Setup vcpkg
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP/vcpkg"
          & "$env:RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat"
          "VCPKG_ROOT=$env:RUNNER_TEMP/vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "C:\Program Files (x86)\NSIS\makensis.exe" /VERSION

      - name: Configure
        shell: bash
        run: ${{ matrix.configure }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        run: cpack --config build/CPackConfig.cmake -C Release
        working-directory: ${{ github.workspace }}

      - name: Validate Debian package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          deb_file=$(find . -type f -name 'mqttvscpd_*.deb' -print -quit)
          if [ -z "$deb_file" ]; then
            echo "No Debian package produced" >&2
            exit 1
          fi
          bash resources/debpkg/validate-package.sh "$deb_file"

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: vscpd-${{ matrix.name }}
          if-no-files-found: error
          path: |
            *.deb
            *.rpm
            *.tar.gz
            *.tgz
            *.zip
            *.exe
            build/*.deb
            build/*.tar.gz
            build/*.tgz
            build/*.zip
            build/*.exe

  raspberry-pi:
    name: Raspberry Pi ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arm64
            platform: linux/arm64
            image: arm64v8/ubuntu:24.04
          - name: armhf
            platform: linux/arm/v7
            image: arm32v7/ubuntu:24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set mainline version
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        shell: bash
        run: |
          year=$(date -u +%y)
          month=$(date -u +%m)
          patch=$(git rev-list --count --first-parent HEAD)
          sed -i -E "s/(MQTTVSCPD_VERSION_MAJOR[[:space:]]+)[0-9]+/\\1${year}/" src/version.h
          sed -i -E "s/(MQTTVSCPD_VERSION_MINOR[[:space:]]+)[0-9]+/\\1${month}/" src/version.h
          sed -i -E "s/(MQTTVSCPD_VERSION_PATCH[[:space:]]+)[0-9]+/\\1${patch}/" src/version.h
          sed -i -E "s/(MQTTVSCPD_VERSION_STRING[[:space:]]+).*/\\1\"${year}.${month}.${patch}\"/" src/version.h
          sed -i -E "s/(MQTTVSCPD_DISPLAY_VERSION[[:space:]]+).*/\\1\"${year}.${month}.${patch}\"/" src/version.h

      - name: Enable ARM emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,arm

      - name: Build and package
        run: >-
          docker run --rm
          --platform ${{ matrix.platform }}
          -e VSCPD_BUILD_NUMBER=${VSCPD_BUILD_NUMBER}
          -v "${{ github.workspace }}:/workspace"
          -w /workspace
          ${{ matrix.image }}
          bash -euxo pipefail -c "
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y \
              build-essential \
              cmake \
              curl \
              file \
              libcurl4-openssl-dev \
              libexpat1-dev \
              libmosquitto-dev \
              libssl-dev \
              libsystemd-dev \
              mosquitto \
              pandoc \
              pkg-config \
              python3 \
              rpm
            cmake -S . -B build \
              -DCMAKE_BUILD_TYPE=Release \
              -DVSCPD_BUILD_NUMBER=${VSCPD_BUILD_NUMBER} \
              '-DVSCPD_PACKAGE_GENERATORS=TGZ;DEB;RPM;ZIP'
            cmake --build build --parallel
            cpack --config build/CPackConfig.cmake -C Release
            deb_file=\$(find . -type f -name \"mqttvscpd_*.deb\" -print -quit)
            if [ -z \"\$deb_file\" ]; then
              echo \"No Debian package produced\" >&2
              exit 1
            fi
            bash resources/debpkg/validate-package.sh \"\$deb_file\"
            file mqtt-vscpd* || true
          "

      - name: Upload Raspberry Pi artifacts
        uses: actions/upload-artifact@v5
        with:
          name: vscpd-raspberry-pi-${{ matrix.name }}
          if-no-files-found: error
          path: |
            *.deb
            *.rpm
            *.tar.gz
            *.tgz
            *.zip
name: CI Linux

on:
  push:
    branches:
      - main
      - master
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Linux (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set build version
        shell: bash
        run: bash scripts/update-version.sh

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            curl \
            libcurl4-openssl-dev \
            libexpat1-dev \
            libmosquitto-dev \
            libsqlite3-dev \
            libssl-dev \
            libsystemd-dev \
            mosquitto \
            pandoc \
            pkg-config \
            rpm

      - name: Configure
        shell: bash
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DVSCPD_PACKAGE_GENERATORS=TGZ\;DEB\;RPM\;ZIP

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        run: cpack --config build/CPackConfig.cmake -C Release
        working-directory: ${{ github.workspace }}

      - name: Validate Debian package
        shell: bash
        run: |
          set -euo pipefail
          deb_file=$(find . -type f -name 'mqttvscpd*.deb' -print -quit)
          if [ -z "$deb_file" ]; then
            echo "No Debian package produced" >&2
            exit 1
          fi
          bash resources/debpkg/validate-package.sh "$deb_file"

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          find . build -maxdepth 1 -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.tar.gz' \
               -o -name '*.tgz' -o -name '*.zip' \) -print0 2>/dev/null |
            xargs -0 -r sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: mqttvscpd-${{ env.VSCPD_VERSION }}-${{ matrix.os }}
          if-no-files-found: error
          path: |
            *.deb
            *.rpm
            *.tar.gz
            *.tgz
            *.zip
            *.sha256
            SHA256SUMS
            build/*.deb
            build/*.rpm
            build/*.tar.gz
            build/*.tgz
            build/*.zip
            build/*.sha256

name: CI Raspberry Pi

on:
  push:
    branches:
      - main
      - master
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  VSCPD_BUILD_NUMBER: ${{ github.run_number }}

jobs:
  build:
    name: Raspberry Pi ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arm64
            platform: linux/arm64
            image: arm64v8/ubuntu:24.04
          - name: armhf
            platform: linux/arm/v7
            image: arm32v7/ubuntu:24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set build version
        shell: bash
        run: bash scripts/update-version.sh

      - name: Enable ARM emulation
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64,arm

      - name: Build and package
        run: >-
          docker run --rm
          --platform ${{ matrix.platform }}
          -e VSCPD_BUILD_NUMBER=${VSCPD_BUILD_NUMBER}
          -v "${{ github.workspace }}:/workspace"
          -w /workspace
          ${{ matrix.image }}
          bash -euxo pipefail -c "
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y \
              build-essential \
              cmake \
              curl \
              file \
              libcurl4-openssl-dev \
              libexpat1-dev \
              libmosquitto-dev \
              libssl-dev \
              libsystemd-dev \
              mosquitto \
              pandoc \
              pkg-config \
              python3 \
              rpm
            cmake -S . -B build \
              -DCMAKE_BUILD_TYPE=Release \
              -DVSCPD_BUILD_NUMBER=${VSCPD_BUILD_NUMBER} \
              '-DVSCPD_PACKAGE_GENERATORS=TGZ;DEB;RPM;ZIP'
            cmake --build build --parallel
            cpack --config build/CPackConfig.cmake -C Release
            deb_file=\$(find . -type f -name \"mqttvscpd*.deb\" -print -quit)
            if [ -z \"\$deb_file\" ]; then
              echo \"No Debian package produced\" >&2
              exit 1
            fi
            bash resources/debpkg/validate-package.sh \"\$deb_file\"
            file mqtt-vscpd* || true
          "

      - name: Upload Raspberry Pi artifacts
        uses: actions/upload-artifact@v5
        with:
          name: mqttvscpd-${{ env.VSCPD_VERSION }}-raspberry-pi-${{ matrix.name }}
          if-no-files-found: error
          path: |
            *.deb
            *.rpm
            *.tar.gz
            *.tgz
            *.zip
            *.sha256
            build/*.deb
            build/*.rpm
            build/*.tar.gz
            build/*.tgz
            build/*.zip
            build/*.sha256

rules:
  - id: bash.curl.security.curl-eval.curl-eval
    severity: WARNING
    languages:
      - bash
    message: Data is being eval'd from a `curl` command. An attacker with control of
      the server in the `curl` command could inject malicious code into the
      `eval`, resulting in a system comrpomise. Avoid eval'ing untrusted data if
      you can. If you must do this, consider checking the SHA sum of the content
      returned by the server to verify its integrity.
    metadata:
      owasp:
        - A03:2021 - Injection
      cwe:
        - "CWE-95: Improper Neutralization of Directives in Dynamically
          Evaluated Code ('Eval Injection')"
      category: security
      technology:
        - bash
        - curl
      confidence: MEDIUM
      references:
        - https://owasp.org/Top10/A03_2021-Injection
      subcategory:
        - vuln
      likelihood: MEDIUM
      impact: MEDIUM
    mode: taint
    pattern-sources:
      - pattern: |
          $(curl ...)
      - pattern: |
          `curl ...`
    pattern-sinks:
      - pattern: eval ...
  - id: c.lang.security.insecure-use-gets-fn.insecure-use-gets-fn
    pattern: gets(...)
    message: Avoid 'gets()'. This function does not consider buffer boundaries and
      can lead to buffer overflows. Use 'fgets()' or 'gets_s()' instead.
    metadata:
      cwe:
        - "CWE-676: Use of Potentially Dangerous Function"
      references:
        - https://us-cert.cisa.gov/bsi/articles/knowledge/coding-practices/fgets-and-gets_s
      category: security
      technology:
        - c
      confidence: MEDIUM
      subcategory:
        - audit
      likelihood: LOW
      impact: HIGH
    languages:
      - c
    severity: ERROR
  - id: c.lang.security.random-fd-exhaustion.random-fd-exhaustion
    pattern-either:
      - patterns:
          - pattern: |
              $FD = open("/dev/urandom", ...);
              ...
              read($FD, ...);
          - pattern-not: |
              $FD = open("/dev/urandom", ...);
              ...
              $BYTES_READ = read($FD, ...);
      - patterns:
          - pattern: |
              $FD = open("/dev/random", ...);
              ...
              read($FD, ...);
          - pattern-not: |
              $FD = open("/dev/random", ...);
              ...
              $BYTES_READ = read($FD, ...);
    message: Call to 'read()' without error checking is susceptible to file
      descriptor exhaustion. Consider using the 'getrandom()' function.
    metadata:
      cwe:
        - "CWE-774: Allocation of File Descriptors or Handles Without Limits or
          Throttling"
      references:
        - https://lwn.net/Articles/606141/
      category: security
      technology:
        - c
      confidence: MEDIUM
      subcategory:
        - audit
      likelihood: LOW
      impact: HIGH
    languages:
      - c
    severity: WARNING
  - id: generic.secrets.security.detected-stripe-restricted-api-key.detected-stripe-restricted-api-key
    pattern-regex: rk_live_[0-9a-zA-Z]{24}
    languages:
      - regex
    message: Stripe Restricted API Key detected
    severity: ERROR
    metadata:
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
      source-rule-url: https://github.com/dxa4481/truffleHogRegexes/blob/master/truffleHogRegexes/regexes.json
      category: security
      technology:
        - secrets
        - stripe
      confidence: MEDIUM
      owasp:
        - A07:2021 - Identification and Authentication Failures
      references:
        - https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - audit
      likelihood: LOW
      impact: LOW
  - id: generic.secrets.security.detected-username-and-password-in-uri.detected-username-and-password-in-uri
    patterns:
      - pattern: $PROTOCOL://$...USERNAME:$...PASSWORD@$END
      - metavariable-regex:
          metavariable: $...USERNAME
          regex: \A({?)([A-Za-z])([A-Za-z0-9_-]){5,31}(}?)\Z
      - metavariable-regex:
          metavariable: $...PASSWORD
          regex: (?!.*[\s])(?=.*[0-9])(?=.*[a-z])(?=.*[A-Z])(?=.*[!"#$%&'()*+,-./:;<=>?@[\]^_`{|}~]){6,32}
      - metavariable-regex:
          metavariable: $PROTOCOL
          regex: (.*http.*)|(.*sql.*)|(.*ftp.*)|(.*smtp.*)
    languages:
      - generic
    message: Username and password in URI detected
    severity: ERROR
    metadata:
      owasp:
        - A07:2021 - Identification and Authentication Failures
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
      references:
        - https://github.com/grab/secret-scanner/blob/master/scanner/signatures/pattern.go
      category: security
      technology:
        - secrets
      confidence: MEDIUM
      license: Commons Clause License Condition v1.0[LGPL-2.1-only]
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - vuln
      likelihood: MEDIUM
      impact: MEDIUM
  - id: generic.secrets.security.google-maps-apikeyleak.google-maps-apikeyleak
    patterns:
      - pattern-regex: ^(AIza[0-9A-Za-z_-]{35}(?!\S))$
    message: Detects potential Google Maps API keys in code
    languages:
      - generic
    severity: WARNING
    metadata:
      description: Detects potential Google Maps API keys in code
      severity: MEDIUM
      category: security
      confidence: MEDIUM
      impact: HIGH
      likelihood: MEDIUM
      subcategory:
        - audit
      owasp:
        - A3:2017 Sensitive Data Exposure
      references:
        - https://ozguralp.medium.com/unauthorized-google-maps-api-key-usage-cases-and-why-you-need-to-care-1ccb28bf21e
      cwe:
        - "CWE-538: Insertion of Sensitive Information into
          Externally-Accessible File or Directory"
      technology:
        - Google Maps
  - id: json.aws.security.public-s3-bucket.public-s3-bucket
    languages:
      - json
    message: Detected public S3 bucket. This policy allows anyone to have some kind
      of access to the bucket. The exact level of access and types of actions
      allowed will depend on the configuration of bucket policy and ACLs. Please
      review the bucket configuration to make sure they are set with intended
      values.
    metadata:
      category: security
      cwe:
        - "CWE-264: CWE CATEGORY: Permissions, Privileges, and Access Controls"
      license: Commons Clause License Condition v1.0[LGPL-2.1-only]
      owasp:
        - A01:2021 - Broken Access Control
      references:
        - https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-control-block-public-access.html
      technology:
        - aws
      subcategory:
        - vuln
      likelihood: LOW
      impact: HIGH
      confidence: MEDIUM
    patterns:
      - pattern-inside: |
          $BUCKETNAME: {
            "Type": "AWS::S3::Bucket",
            "Properties": {
            ...,
            },
            ...,
          }
      - pattern-either:
          - pattern: |
              "PublicAccessBlockConfiguration": {
                   ...,
                   "RestrictPublicBuckets": false,
                   ...,
                 },
          - pattern: |
              "PublicAccessBlockConfiguration": {
                   ...,
                   "IgnorePublicAcls": false,
                   ...,
                 },
          - pattern: |
              "PublicAccessBlockConfiguration": {
                   ...,
                   "BlockPublicAcls": false,
                   ...,
                 },
          - pattern: |
              "PublicAccessBlockConfiguration": {
                   ...,
                   "BlockPublicPolicy": false,
                   ...,
                 },
    severity: WARNING
  - id: json.aws.security.public-s3-policy-statement.public-s3-policy-statement
    pattern: |
      {
        "Effect": "Allow",
        "Principal": "*",
        "Resource": [
          ..., "=~/arn:aws:s3.*/", ...
        ],
        ...
      }
    message: Detected public S3 bucket policy. This policy allows anyone to access
      certain properties of or items in the bucket. Do not do this unless you
      will never have sensitive data inside the bucket.
    metadata:
      owasp:
        - A01:2021 - Broken Access Control
      cwe:
        - "CWE-264: CWE CATEGORY: Permissions, Privileges, and Access Controls"
      references:
        - https://docs.aws.amazon.com/AmazonS3/latest/dev/WebsiteAccessPermissionsReqd.html
      category: security
      technology:
        - aws
      subcategory:
        - vuln
      likelihood: LOW
      impact: HIGH
      confidence: MEDIUM
    severity: WARNING
    languages:
      - json
  - id: json.aws.security.wildcard-assume-role.wildcard-assume-role
    patterns:
      - pattern-inside: |
          "Statement": [...]
      - pattern-inside: |
          {..., "Effect": "Allow", ..., "Action": "sts:AssumeRole", ...}
      - pattern: |
          "Principal": {..., "AWS": "*", ...}
    message: "Detected wildcard access granted to sts:AssumeRole. This means anyone
      with your AWS account ID and the name of the role can assume the role.
      Instead, limit to a specific identity in your account, like this:
      `arn:aws:iam::<account_id>:root`."
    metadata:
      cwe:
        - "CWE-250: Execution with Unnecessary Privileges"
      category: security
      technology:
        - aws
      references:
        - https://rhinosecuritylabs.com/aws/assume-worst-aws-assume-role-enumeration/
      owasp:
        - A06:2017 - Security Misconfiguration
        - A05:2021 - Security Misconfiguration
      subcategory:
        - vuln
      likelihood: HIGH
      impact: HIGH
      confidence: MEDIUM
    languages:
      - json
    severity: ERROR
  - id: php.doctrine.security.audit.doctrine-orm-dangerous-query.doctrine-orm-dangerous-query
    languages:
      - php
    message: "`$QUERY` Detected string concatenation with a non-literal variable in
      a Doctrine QueryBuilder method. This could lead to SQL injection if the
      variable is user-controlled and not properly sanitized. In order to
      prevent SQL injection, use parameterized queries or prepared statements
      instead."
    metadata:
      category: security
      cwe:
        - "CWE-89: Improper Neutralization of Special Elements used in an SQL
          Command ('SQL Injection')"
      license: Commons Clause License Condition v1.0[LGPL-2.1-only]
      owasp:
        - A01:2017 - Injection
        - A03:2021 - Injection
      references:
        - https://www.doctrine-project.org/projects/doctrine-dbal/en/current/reference/query-builder.html#security-safely-preventing-sql-injection
        - https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html
      technology:
        - doctrine
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - vuln
      likelihood: MEDIUM
      impact: MEDIUM
      confidence: MEDIUM
    mode: taint
    pattern-sinks:
      - patterns:
          - focus-metavariable: $SINK
          - pattern-either:
              - pattern: $QUERY->add(...,$SINK,...)
              - pattern: $QUERY->select(...,$SINK,...)
              - pattern: $QUERY->addSelect(...,$SINK,...)
              - pattern: $QUERY->delete(...,$SINK,...)
              - pattern: $QUERY->update(...,$SINK,...)
              - pattern: $QUERY->insert(...,$SINK,...)
              - pattern: $QUERY->from(...,$SINK,...)
              - pattern: $QUERY->join(...,$SINK,...)
              - pattern: $QUERY->innerJoin(...,$SINK,...)
              - pattern: $QUERY->leftJoin(...,$SINK,...)
              - pattern: $QUERY->rightJoin(...,$SINK,...)
              - pattern: $QUERY->where(...,$SINK,...)
              - pattern: $QUERY->andWhere(...,$SINK,...)
              - pattern: $QUERY->orWhere(...,$SINK,...)
              - pattern: $QUERY->groupBy(...,$SINK,...)
              - pattern: $QUERY->addGroupBy(...,$SINK,...)
              - pattern: $QUERY->having(...,$SINK,...)
              - pattern: $QUERY->andHaving(...,$SINK,...)
              - pattern: $QUERY->orHaving(...,$SINK,...)
              - pattern: $QUERY->orderBy(...,$SINK,...)
              - pattern: $QUERY->addOrderBy(...,$SINK,...)
              - pattern: $QUERY->set($SINK,...)
              - pattern: $QUERY->setValue($SINK,...)
          - pattern-either:
              - pattern-inside: |
                  $Q = $X->createQueryBuilder();
                  ...
              - pattern-inside: |
                  $Q = new QueryBuilder(...);
                  ...
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: sprintf(...)
              - pattern: |
                  "...".$SMTH
    severity: WARNING
  - id: php.lang.security.assert-use.assert-use
    mode: taint
    pattern-sources:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: $_GET
                  - pattern: $_POST
                  - pattern: $_COOKIE
                  - pattern: $_REQUEST
                  - pattern: $_SERVER
          - patterns:
              - pattern: |
                  Route::$METHOD($ROUTENAME, function(..., $ARG, ...) { ... })
              - focus-metavariable: $ARG
    pattern-sinks:
      - patterns:
          - pattern: assert($SINK, ...);
          - pattern-not: assert("...", ...);
          - pattern: $SINK
    message: Calling assert with user input is equivalent to eval'ing.
    metadata:
      owasp:
        - A03:2021 - Injection
      cwe:
        - "CWE-95: Improper Neutralization of Directives in Dynamically
          Evaluated Code ('Eval Injection')"
      references:
        - https://www.php.net/manual/en/function.assert
        - https://github.com/FloeDesignTechnologies/phpcs-security-audit/blob/master/Security/Sniffs/BadFunctions/AssertsSniff.php
      category: security
      technology:
        - php
      confidence: HIGH
      subcategory:
        - vuln
      likelihood: MEDIUM
      impact: MEDIUM
    languages:
      - php
    severity: ERROR
  - id: php.lang.security.base-convert-loses-precision.base-convert-loses-precision
    message: The function base_convert uses 64-bit numbers internally, and does not
      correctly convert large numbers. It is not suitable for random tokens such
      as those used for session tokens or CSRF tokens.
    metadata:
      references:
        - https://www.php.net/base_convert
        - https://www.sjoerdlangkemper.nl/2017/03/15/dont-use-base-convert-on-random-tokens/
      category: security
      technology:
        - php
      cwe:
        - "CWE-190: Integer Overflow or Wraparound"
      subcategory:
        - audit
      likelihood: LOW
      impact: LOW
      confidence: HIGH
    languages:
      - php
    severity: WARNING
    mode: taint
    pattern-sources:
      - pattern: hash(...)
      - pattern: hash_hmac(...)
      - pattern: sha1(...)
      - pattern: md5(...)
      - patterns:
          - pattern: random_bytes($N)
          - metavariable-comparison:
              metavariable: $N
              comparison: $N > 7
      - patterns:
          - pattern: openssl_random_pseudo_bytes($N)
          - metavariable-comparison:
              metavariable: $N
              comparison: $N > 7
      - patterns:
          - pattern: $OBJ->get_random_bytes($N)
          - metavariable-comparison:
              metavariable: $N
              comparison: $N > 7
    pattern-sinks:
      - pattern: base_convert(...)
    pattern-sanitizers:
      - patterns:
          - pattern: substr(..., $LENGTH)
          - metavariable-comparison:
              metavariable: $LENGTH
              comparison: $LENGTH <= 7
  - id: php.lang.security.curl-ssl-verifypeer-off.curl-ssl-verifypeer-off
    patterns:
      - pattern-either:
          - pattern: |
              $ARG = $IS_VERIFIED;
              ...
              curl_setopt(..., CURLOPT_SSL_VERIFYPEER, $ARG);
          - pattern: curl_setopt(..., CURLOPT_SSL_VERIFYPEER, $IS_VERIFIED)
      - metavariable-regex:
          metavariable: $IS_VERIFIED
          regex: 0|false|null
    message: SSL verification is disabled but should not be (currently
      CURLOPT_SSL_VERIFYPEER= $IS_VERIFIED)
    metadata:
      cwe:
        - "CWE-319: Cleartext Transmission of Sensitive Information"
      references:
        - https://www.saotn.org/dont-turn-off-curlopt_ssl_verifypeer-fix-php-configuration/
      category: security
      technology:
        - php
      owasp:
        - A03:2017 - Sensitive Data Exposure
        - A02:2021 - Cryptographic Failures
      subcategory:
        - vuln
      likelihood: LOW
      impact: LOW
      confidence: MEDIUM
    languages:
      - php
    severity: ERROR
  - id: php.lang.security.deserialization.extract-user-data
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $_GET[...]
          - pattern: $_FILES[...]
          - pattern: $_POST[...]
    pattern-sinks:
      - pattern: extract(...)
    pattern-sanitizers:
      - pattern: extract($VAR, EXTR_SKIP,...)
    message: Do not call 'extract()' on user-controllable data. If you must, then
      you must also provide the EXTR_SKIP flag to prevent overwriting existing
      variables.
    languages:
      - php
    metadata:
      category: security
      cwe:
        - "CWE-502: Deserialization of Untrusted Data"
      owasp:
        - A08:2017 - Insecure Deserialization
        - A08:2021 - Software and Data Integrity Failures
      technology:
        - php
      references:
        - https://www.php.net/manual/en/function.extract.php#refsect1-function.extract-notes
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - vuln
      likelihood: MEDIUM
      impact: MEDIUM
      confidence: MEDIUM
    severity: ERROR
  - id: php.lang.security.injection.echoed-request.echoed-request
    mode: taint
    message: "`Echo`ing user input risks cross-site scripting vulnerability. You
      should use `htmlentities()` when showing data to users."
    languages:
      - php
    severity: ERROR
    pattern-sources:
      - pattern: $_REQUEST
      - pattern: $_GET
      - pattern: $_POST
    pattern-sinks:
      - pattern: echo $...VARS;
    pattern-sanitizers:
      - pattern: htmlentities(...)
      - pattern: htmlspecialchars(...)
      - pattern: strip_tags(...)
      - pattern: isset(...)
      - pattern: empty(...)
      - pattern: esc_html(...)
      - pattern: esc_attr(...)
      - pattern: wp_kses(...)
      - pattern: e(...)
      - pattern: twig_escape_filter(...)
      - pattern: xss_clean(...)
      - pattern: html_escape(...)
      - pattern: Html::escape(...)
      - pattern: Xss::filter(...)
      - pattern: escapeHtml(...)
      - pattern: escapeHtml(...)
      - pattern: escapeHtmlAttr(...)
    fix: echo htmlentities($...VARS);
    metadata:
      technology:
        - php
      cwe:
        - "CWE-79: Improper Neutralization of Input During Web Page Generation
          ('Cross-site Scripting')"
      owasp:
        - A07:2017 - Cross-Site Scripting (XSS)
        - A03:2021 - Injection
      category: security
      references:
        - https://www.php.net/manual/en/function.htmlentities.php
        - https://www.php.net/manual/en/reserved.variables.request.php
        - https://www.php.net/manual/en/reserved.variables.post.php
        - https://www.php.net/manual/en/reserved.variables.get.php
        - https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - vuln
      likelihood: MEDIUM
      impact: MEDIUM
      confidence: MEDIUM
  - id: php.lang.security.injection.printed-request.printed-request
    mode: taint
    message: "`Printing user input risks cross-site scripting vulnerability. You
      should use `htmlentities()` when showing data to users."
    languages:
      - php
    severity: ERROR
    pattern-sources:
      - pattern: $_REQUEST
      - pattern: $_GET
      - pattern: $_POST
    pattern-sinks:
      - pattern: print($...VARS);
    pattern-sanitizers:
      - pattern: htmlentities(...)
      - pattern: htmlspecialchars(...)
      - pattern: strip_tags(...)
      - pattern: isset(...)
      - pattern: empty(...)
      - pattern: esc_html(...)
      - pattern: esc_attr(...)
      - pattern: wp_kses(...)
      - pattern: e(...)
      - pattern: twig_escape_filter(...)
      - pattern: xss_clean(...)
      - pattern: html_escape(...)
      - pattern: Html::escape(...)
      - pattern: Xss::filter(...)
      - pattern: escapeHtml(...)
      - pattern: escapeHtml(...)
      - pattern: escapeHtmlAttr(...)
    fix: print(htmlentities($...VARS));
    metadata:
      technology:
        - php
      cwe:
        - "CWE-79: Improper Neutralization of Input During Web Page Generation
          ('Cross-site Scripting')"
      owasp:
        - A07:2017 - Cross-Site Scripting (XSS)
        - A03:2021 - Injection
      category: security
      references:
        - https://www.php.net/manual/en/function.htmlentities.php
        - https://www.php.net/manual/en/reserved.variables.request.php
        - https://www.php.net/manual/en/reserved.variables.post.php
        - https://www.php.net/manual/en/reserved.variables.get.php
        - https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - vuln
      likelihood: MEDIUM
      impact: MEDIUM
      confidence: MEDIUM
  - id: php.lang.security.injection.tainted-filename.tainted-filename
    severity: WARNING
    message: File name based on user input risks server-side request forgery.
    metadata:
      technology:
        - php
      category: security
      cwe:
        - "CWE-918: Server-Side Request Forgery (SSRF)"
      owasp:
        - A10:2021 - Server-Side Request Forgery (SSRF)
      references:
        - https://owasp.org/Top10/A10_2021-Server-Side_Request_Forgery_%28SSRF%29
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - vuln
      impact: MEDIUM
      likelihood: MEDIUM
      confidence: MEDIUM
    languages:
      - php
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: $_GET
              - pattern: $_POST
              - pattern: $_COOKIE
              - pattern: $_REQUEST
              - pattern: $_SERVER
    pattern-sanitizers:
      - patterns:
          - pattern-either:
              - pattern-inside: basename($PATH, ...)
              - pattern-inside: linkinfo($PATH, ...)
              - pattern-inside: readlink($PATH, ...)
              - pattern-inside: realpath($PATH, ...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern-inside: opcache_compile_file($FILENAME, ...)
              - pattern-inside: opcache_invalidate($FILENAME, ...)
              - pattern-inside: opcache_is_script_cached($FILENAME, ...)
              - pattern-inside: runkit7_import($FILENAME, ...)
              - pattern-inside: readline_read_history($FILENAME, ...)
              - pattern-inside: readline_write_history($FILENAME, ...)
              - pattern-inside: rar_open($FILENAME, ...)
              - pattern-inside: zip_open($FILENAME, ...)
              - pattern-inside: gzfile($FILENAME, ...)
              - pattern-inside: gzopen($FILENAME, ...)
              - pattern-inside: readgzfile($FILENAME, ...)
              - pattern-inside: hash_file($ALGO, $FILENAME, ...)
              - pattern-inside: hash_update_file($CONTEXT, $FILENAME, ...)
              - pattern-inside: pg_trace($FILENAME, ...)
              - pattern-inside: dio_open($FILENAME, ...)
              - pattern-inside: finfo_file($FINFO, $FILENAME, ...)
              - pattern-inside: mime_content_type($FILENAME, ...)
              - pattern-inside: chgrp($FILENAME, ...)
              - pattern-inside: chmod($FILENAME, ...)
              - pattern-inside: chown($FILENAME, ...)
              - pattern-inside: clearstatcache($CLEAR_REALPATH_CACHE, $FILENAME, ...)
              - pattern-inside: file_exists($FILENAME, ...)
              - pattern-inside: file_get_contents($FILENAME, ...)
              - pattern-inside: file_put_contents($FILENAME, ...)
              - pattern-inside: file($FILENAME, ...)
              - pattern-inside: fileatime($FILENAME, ...)
              - pattern-inside: filectime($FILENAME, ...)
              - pattern-inside: filegroup($FILENAME, ...)
              - pattern-inside: fileinode($FILENAME, ...)
              - pattern-inside: filemtime($FILENAME, ...)
              - pattern-inside: fileowner($FILENAME, ...)
              - pattern-inside: fileperms($FILENAME, ...)
              - pattern-inside: filesize($FILENAME, ...)
              - pattern-inside: filetype($FILENAME, ...)
              - pattern-inside: fnmatch($PATTERN, $FILENAME, ...)
              - pattern-inside: fopen($FILENAME, ...)
              - pattern-inside: is_dir($FILENAME, ...)
              - pattern-inside: is_executable($FILENAME, ...)
              - pattern-inside: is_file($FILENAME, ...)
              - pattern-inside: is_link($FILENAME, ...)
              - pattern-inside: is_readable($FILENAME, ...)

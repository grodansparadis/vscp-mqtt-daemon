              - pattern: $_COOKIE
              - pattern: $_REQUEST
    pattern-sinks:
      - pattern-either:
          - patterns:
              - pattern: |
                  sprintf($URLSTR, ...)
              - metavariable-pattern:
                  metavariable: $URLSTR
                  language: generic
                  pattern: $SCHEME://%s
          - patterns:
              - pattern: |
                  "...{$EXPR}..."
              - pattern-regex: |
                  .*://\{.*
          - patterns:
              - pattern: |
                  "...$EXPR..."
              - pattern-regex: |
                  .*://\$.*
          - patterns:
